<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5ff" />
    <meta name="description" content="SplitSmart — shared expenses made simple." />
    <title>SplitSmart — Shared expenses, simplified</title>
    <script>
      // Paint the correct theme before the app mounts to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem("splitsmart:theme") || "system";
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved =
            stored === "system" ? (prefersDark ? "dark" : "light") : stored;
          if (resolved !== "light" && resolved !== "dark") resolved = prefersDark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.style.colorScheme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", resolved === "dark" ? "#14121d" : "#f7f5ff");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
